<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e8590c" />
    <meta name="description" content="Cook Mitra | Your Cook. Your Occasion. Your Kitchen. Book verified home cooks for celebrations and everyday meals." />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/logo.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
    <link rel="canonical" href="https://cookmitra.in/" />
    <!-- Open Graph — controls how the link renders when shared on WhatsApp
         (your #1 channel), Facebook, LinkedIn, etc. Without these, shares
         render as a bare URL with no image or description. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cook Mitra" />
    <meta property="og:title" content="Cook Mitra | Your Cook. Your Occasion. Your Kitchen." />
    <meta
      property="og:description"
      content="Book verified home cooks for festive cooking and everyday meals — in your kitchen, across Pune. Cooks keep 75% of every booking."
    />
    <meta property="og:url" content="https://cookmitra.in/" />
    <meta property="og:image" content="https://cookmitra.in/logo.png" />
    <meta property="og:image:alt" content="Cook Mitra logo" />
    <meta property="og:locale" content="en_IN" />
    <!-- Twitter / X cards (WhatsApp also reads these as a fallback). -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cook Mitra | Your Cook. Your Occasion. Your Kitchen." />
    <meta
      name="twitter:description"
      content="Book verified home cooks for festive cooking and everyday meals — in your kitchen, across Pune."
    />
    <meta name="twitter:image" content="https://cookmitra.in/logo.png" />
    <!-- TODO: replace https://cookmitra.in/ with the real production domain
         once deployed (canonical, og:url, og:image, twitter:image, plus
         public/sitemap.xml). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Cook Mitra | Your Cook. Your Occasion. Your Kitchen.</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
