services:
  # Local MongoDB (dev convenience only). Excluded by default via profiles —
  # plain `docker compose up` starts only `app` (Atlas mode). Add
  # `--profile local-mongo` to also start this container for offline dev.
  db:
    image: mongo:7
    restart: unless-stopped
    profiles: ["local-mongo"]
    volumes:
      - mongo-data:/data/db
    # Not exposed to the host by default; the backend reaches it over the
    # internal network. Uncomment to inspect from the host:
    # ports:
    #   - "27017:27017"

  app:
    build:
      context: .
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-}
        REACT_APP_GOOGLE_CLIENT_ID: ${REACT_APP_GOOGLE_CLIENT_ID:-}
        REACT_APP_RAZORPAY_KEY_ID: ${REACT_APP_RAZORPAY_KEY_ID:-}
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # All server-side day/slot math assumes IST (Asia/Kolkata) — pinning TZ
      # here keeps "today" correct in Docker/UTC hosts, where day boundaries
      # would otherwise drift 5h30m for Indian users (same-day guards, slot
      # windows, stats).
      TZ: ${TZ:-Asia/Kolkata}
      # Database: Atlas by default. Set MONGODB_URI in the .env file next to
      # this compose file to your SRV string
      # (mongodb+srv://<user>:<password>@<cluster>.mongodb.net/<db>?retryWrites=true&w=majority).
      # For offline dev with the local `db` container instead, run with
      # `--profile local-mongo` and set MONGODB_URI=mongodb://db:27017/festivecook.
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in a .env file next to docker-compose.yml}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in a .env file next to docker-compose.yml}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_CURRENCY: ${RAZORPAY_CURRENCY:-INR}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Frontend origin for CORS — empty when served same-origin by this app.
      CLIENT_URL: ${CLIENT_URL:-}
    # No depends_on: the backend retries the DB connection in the background,
    # so startup order doesn't matter (Atlas or local mongo alike).
    volumes:
      # Persist uploaded cook verification documents across restarts.
      - uploads:/app/backend/uploads

volumes:
  mongo-data:
  uploads: