# Render Blueprint — deploy backend + static frontend in one service:
# 1. Push this repo to GitHub.
# 2. In Render: New → Blueprint → select the repo → Apply.
# 3. Fill in the sync:false secrets in the dashboard (JWT_SECRET, Razorpay, Google).
services:
  - type: web
    name: festivecook
    runtime: node
    plan: free # change as needed
    rootDir: .
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Business clock (F-08): booking math is IST-anchored in code; the
      # pinned TZ keeps every other Date call consistent with it.
      - key: TZ
        value: Asia/Kolkata
      # Persistent upload volume mount point (Render Disk → mount at /data,
      # then UPLOAD_DIR=/data/cook-docs). Without this, verification docs are
      # lost on redeploy (see docs/UPLOAD_STORAGE.md).
      # - key: UPLOAD_DIR
      #   value: /data/cook-docs
      # Hard gate: refuse to boot without live Razorpay keys + webhook secret.
      # Set "true" for any deployment that takes real payments.
      # - key: REQUIRE_PAYMENTS
      #   value: "true"
      # Mongo: create a free cluster at mongodb.com/atlas and paste the SRV URI,
      # or create a Render MongoDB add-on and reference its internal URI.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true # long random secret, generated on first deploy
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Frontend build-time values (Render exposes service env vars during
      # the build, and Create React App bakes REACT_APP_* into the bundle).
      # GOOGLE login + Razorpay checkout break without these in production —
      # frontend/.env is gitignored, so the dashboard is the only source.
      - key: REACT_APP_GOOGLE_CLIENT_ID
        sync: false
      - key: REACT_APP_RAZORPAY_KEY_ID
        sync: false
      # Same-origin deployment: the backend serves frontend/build, so CORS is
      # not needed. Set this only if you host the frontend elsewhere.
      # - key: CLIENT_URL
      #   sync: false
      # ---- Scale knobs (optional; sensible defaults ship in code) ----
      # Mongo pool per instance (default 50) and per-IP rate limits
      # (defaults: 300/min general, 100/15min auth, 30/15min payments).
      # - key: MONGO_MAX_POOL_SIZE
      #   value: "50"
      # - key: RATE_LIMIT_GENERAL
      #   value: "300"
      # Shared rate-limit store. Counters are in memory per instance, so N
      # replicas multiply every bucket by N. The buckets named here are backed
      # by a small MongoDB collection instead (no Redis needed), which keeps
      # the security-critical ones exact across the fleet.
      # Default "auth,strict"; use "all" to share every bucket (heavier).
      # - key: RATE_LIMIT_SHARED
      #   value: "auth,strict"
      # NOTE: the server writes uploads to local disk, so multiple
      # instances need a shared/object store (S3/R2) before scaling out.